<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRINTLAB 3D - 3D Printing Showcase & UPI Ordering</title>
    <meta name="description" content="Modern Gen-Z 3D Printing Showcase & Instant UPI Ordering with dynamic time-based day/night themes, KPR campus delivery, and 6-stage order tracking." />
    <meta property="og:title" content="PRINTLAB 3D - 3D Printing Showcase & UPI Ordering" />
    <meta property="og:description" content="Modern Gen-Z 3D Printing Showcase & Instant UPI Ordering with dynamic time-based day/night themes, KPR campus delivery, and 6-stage order tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('printlab_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-neutral-950 text-slate-900 dark:text-neutral-100 antialiased selection:bg-cyan-500/20 selection:text-cyan-300 min-h-screen transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
